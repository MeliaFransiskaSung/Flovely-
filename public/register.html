<body class="auth-page"><div id="site-header"></div><main class="wrap auth-wrap"><section class="auth-card"><span class="auth-flower">✿</span><span class="eyebrow">MULAI CERITA INDAH</span><h1>Buat akun <em>baru</em></h1><p>Simpan bouquet favorit dan pantau pesananmu dengan mudah.</p><form id="register-form" class="form-stack"><label>Nama<input name="nama" type="text" autocomplete="name" placeholder="Nama lengkap" maxlength="100" required></label><label>Email<input name="email" type="email" autocomplete="email" placeholder="nama@email.com" required></label><label>Password<input name="password" type="password" autocomplete="new-password" minlength="6" placeholder="Minimal 6 karakter" required></label><label>Konfirmasi password<input name="confirm_password" type="password" autocomplete="new-password" minlength="6" placeholder="Ulangi password" required></label><button class="button button-primary button-wide" type="submit">Buat akun</button><div class="form-message" aria-live="polite"></div></form><p class="auth-switch">Sudah punya akun? <a href="/login.html">Login</a></p></section></main><footer class="footer"><div class="wrap footer-inner"><a class="brand" href="/">flovely<span>.</span></a><small>© 2026 Flovely</small></div></footer></body>
